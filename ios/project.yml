name: MiniEats
options:
  bundleIdPrefix: com.minieats
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    # Server the apps use until the user sets one in Account / Settings.
    # Point this at a tunnel (Cloudflare/ngrok) to test on a phone without typing.
    MINIEATS_SERVER_URL: https://stubble-grumble-same.ngrok-free.dev
targets:
  MiniEats:
    type: application
    platform: iOS
    sources: [MiniEats]
    info:
      path: MiniEats/Info.plist
      properties:
        CFBundleDisplayName: Mini Eats
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The dev backend is plain http on localhost / your LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connects to your Mini Eats development server.
        MiniEatsServerURL: $(MINIEATS_SERVER_URL)
        NSLocationWhenInUseUsageDescription: Your location is shown on the order map and, for pickup orders, tells us when you should leave so you arrive as your food is ready.
        NSLocationAlwaysAndWhenInUseUsageDescription: With "Always", we can keep updating when to leave for a pickup order while the app is in the background, so the "Time to head out" alert is on time.
        UIBackgroundModes: [location]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minieats.app
        TARGETED_DEVICE_FAMILY: "1"
        # MiniEats/Assets.xcassets; also writes CFBundleIconName (App Store requires it).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  MiniEatsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MiniEatsTests]
    dependencies:
      - target: MiniEats
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MiniEatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MiniEatsUITests]
    dependencies:
      - target: MiniEats
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MiniEats
  MiniEatsMerchant:
    type: application
    platform: iOS
    # Shares the customer app's models, networking and UI building blocks.
    sources:
      - MiniEatsMerchant
      - MiniEats/Models.swift
      - MiniEats/APIClient.swift
      - MiniEats/Views/Components.swift
    info:
      path: MiniEatsMerchant/Info.plist
      properties:
        CFBundleDisplayName: Eats Merchant
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connects to your Mini Eats development server.
        MiniEatsServerURL: $(MINIEATS_SERVER_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minieats.merchant
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  MiniEatsMerchantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MiniEatsMerchantUITests]
    dependencies:
      - target: MiniEatsMerchant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MiniEatsMerchant
schemes:
  MiniEatsMerchant:
    build:
      targets:
        MiniEatsMerchant: all
    test:
      targets: [MiniEatsMerchantUITests]
  MiniEats:
    build:
      targets:
        MiniEats: all
    test:
      targets: [MiniEatsTests, MiniEatsUITests]
