name: MiniEats
options:
  bundleIdPrefix: com.minieats
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  MiniEats:
    type: application
    platform: iOS
    sources: [MiniEats]
    info:
      path: MiniEats/Info.plist
      properties:
        CFBundleDisplayName: Mini Eats
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The dev backend is plain http on localhost / your LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connects to your Mini Eats development server.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minieats.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  MiniEatsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MiniEatsTests]
    dependencies:
      - target: MiniEats
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MiniEatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MiniEatsUITests]
    dependencies:
      - target: MiniEats
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MiniEats
schemes:
  MiniEats:
    build:
      targets:
        MiniEats: all
    test:
      targets: [MiniEatsTests, MiniEatsUITests]
