name: MiniEats
options:
  bundleIdPrefix: com.minieats
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    # The kitchen backend both apps use (the team's BarMade API on Render).
    # Users can change it in Account / Settings.
    BARMADE_API_URL: https://barmade-riw5.onrender.com
    # The customer web app (Railway). Optional: gives the iPhone app the same
    # dish photos, descriptions and categories as the web menu.
    BARMADE_WEB_URL: ""
targets:
  MiniEats:
    type: application
    platform: iOS
    sources: [MiniEats, Shared]
    info:
      path: MiniEats/Info.plist
      properties:
        CFBundleDisplayName: BarMade
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Lets a locally run web app (http://localhost:3000) serve photos.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connects to a BarMade server on your network.
        BarMadeServerURL: $(BARMADE_API_URL)
        BarMadeWebURL: $(BARMADE_WEB_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minieats.app
        TARGETED_DEVICE_FAMILY: "1"
        # MiniEats/Assets.xcassets; also writes CFBundleIconName (App Store requires it).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  MiniEatsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MiniEatsTests]
    dependencies:
      - target: MiniEats
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MiniEatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MiniEatsUITests]
    dependencies:
      - target: MiniEats
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MiniEats
  MiniEatsMerchantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MiniEatsMerchantUITests]
    dependencies:
      - target: MiniEatsMerchant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MiniEatsMerchant
  MiniEatsMerchant:
    type: application
    platform: iOS
    # Shares the BarMade client, models and UI building blocks with the customer app.
    sources: [MiniEatsMerchant, Shared]
    info:
      path: MiniEatsMerchant/Info.plist
      properties:
        CFBundleDisplayName: BarMade Merchant
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connects to a BarMade server on your network.
        BarMadeServerURL: $(BARMADE_API_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minieats.merchant
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
schemes:
  MiniEatsMerchant:
    build:
      targets:
        MiniEatsMerchant: all
    test:
      targets: [MiniEatsMerchantUITests]
  MiniEats:
    build:
      targets:
        MiniEats: all
    test:
      targets: [MiniEatsTests, MiniEatsUITests]
