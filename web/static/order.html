<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nonna Rosa · Order</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1b1b1b; --muted:#6b6b6b; --line:#e4e2dd; --accent:#0f9d58; --warn:#d9480f; --bad:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 18px; background:#1d2b24; color:#fff; }
  header h1 { margin:0; font-size:20px; } header small { color:#b9c7bf; display:block; font-size:12px; }
  main { max-width:560px; margin:0 auto; padding:14px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  h2 { margin:0 0 8px; font-size:15px; } .muted { color:var(--muted); font-size:13px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { border:1.5px solid var(--line); border-radius:999px; padding:7px 12px; cursor:pointer; font-size:14px; background:#fff; }
  .chip.on { border-color:var(--accent); background:#eaf7ef; font-weight:600; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .item .d { color:var(--muted); font-size:13px; }
  .left { font-size:12px; } .left.low { color:var(--warn); font-weight:600; } .left.out { color:var(--bad); font-weight:600; }
  .step { display:flex; align-items:center; gap:6px; }
  .step button { width:34px; height:34px; border-radius:50%; border:0; background:#eceae5; font-size:18px; cursor:pointer; }
  .step span { min-width:20px; text-align:center; font-weight:600; }
  input[type=text] { font:inherit; padding:9px 10px; border:1px solid #cfcbc3; border-radius:8px; width:100%; }
  button.primary { width:100%; font:inherit; font-weight:600; padding:13px; border:0; border-radius:10px; background:#1d2b24; color:#fff; cursor:pointer; font-size:16px; }
  button.primary:disabled { opacity:.45; }
  .result { background:#eaf7ef; border:1px solid #bfe6cf; border-radius:10px; padding:12px; }
  .err { background:#fff3f3; border:1px solid #f3c2c2; border-radius:10px; padding:12px; color:#9b1c1c; }
  .mv { font-size:13px; margin-top:6px; } .mv div { display:flex; justify-content:space-between; padding:2px 0; }
  .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:#2f4a3c; color:#d8efe2; }
</style>
</head>
<body>
<header><h1 id="rname">Trattoria Nonna Rosa</h1><small>Classroom demo · every channel below is simulated · nothing is charged</small></header>
<main>
  <section>
    <h2>1. Where is this order coming from? <span class="tag">simulated</span></h2>
    <div class="chips" id="channels"></div>
    <div class="muted" id="chan-note" style="margin-top:6px"></div>
  </section>
  <section>
    <h2>2. Pick your dishes</h2>
    <div id="menu"></div>
  </section>
  <section>
    <h2>3. Your name <span class="muted">(optional)</span></h2>
    <input type="text" id="name" placeholder="So the kitchen knows who ordered" autocomplete="given-name">
  </section>
  <button class="primary" id="submit" disabled>Place order</button>
  <div id="out" style="margin-top:12px"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const api = (p, o={}) => fetch(p, {headers:{"content-type":"application/json"}, ...o}).then(async r => { const j = await r.json(); if (!r.ok) throw j.error || j; return j; });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = v => "$" + Number(v).toFixed(2);
let channels = [], menu = [], channel = localStorage.getItem("channel") || "", cart = {};

async function init() {
  const st = await api("/api/state");
  channels = st.channels; menu = st.menu; $("#rname").textContent = st.restaurant.name;
  if (!channels.some(c => c.id === channel)) channel = "";
  renderChannels(); renderMenu(); update();
  setInterval(async () => { menu = (await api("/api/menu")); renderMenu(); }, 5000);
}
function renderChannels() {
  $("#channels").innerHTML = channels.map(c => `<div class="chip ${c.id === channel ? "on" : ""}" onclick="pick('${c.id}')">${c.icon} ${esc(c.label)}</div>`).join("");
  const c = channels.find(x => x.id === channel);
  $("#chan-note").textContent = c && c.note ? c.note : "Choose the channel you're pretending to order through.";
}
function pick(id) { channel = id; localStorage.setItem("channel", id); renderChannels(); update(); }
function renderMenu() {
  $("#menu").innerHTML = menu.map(m => {
    const s = m.servings.servings, cls = m.paused || s === 0 ? "out" : s <= 5 ? "low" : "";
    const left = m.paused ? "Paused by the kitchen" : s === 0 ? "Sold out (estimated)" : s <= 5 ? `Only ~${s} left (estimated)` : `~${s} left (estimated)`;
    const q = cart[m.id] || 0, dis = m.paused || s === 0;
    return `<div class="item"><div><b>${esc(m.name)}</b> ${money(m.price)}<div class="d">${esc(m.description)}</div><div class="left ${cls}">${left}</div></div>
      <div class="step"><button onclick="add('${m.id}',-1)" ${q ? "" : "disabled"}>−</button><span>${q}</span><button onclick="add('${m.id}',1)" ${dis || q >= s ? "disabled" : ""}>+</button></div></div>`;
  }).join("");
}
function add(id, d) { cart[id] = Math.max(0, (cart[id] || 0) + d); renderMenu(); update(); }
function update() { $("#submit").disabled = !channel || !Object.values(cart).some(q => q > 0); }

$("#submit").onclick = async () => {
  const lines = Object.entries(cart).filter(([, q]) => q > 0).map(([menu_item_id, quantity]) => ({menu_item_id, quantity}));
  $("#submit").disabled = true;
  try {
    const r = await api("/api/orders", {method:"POST", body:JSON.stringify({channel, lines, customer: $("#name").value.trim() || null})});
    const o = r.order;
    $("#out").innerHTML = `<div class="result"><b>Order ${o.id} received via ${esc(o.channel_label)}</b> — ${money(o.total)}
      <div class="muted">${o.lines.map(l => `${l.quantity}× ${esc(l.name)}`).join(", ")}</div>
      <div class="mv"><b>What it did to the kitchen's estimated stock</b>${o.movements.map(m => `<div><span>${esc(m.ingredient)}</span><span>${m.delta} ${m.unit} → ${Number(m.after).toLocaleString()} ${m.unit}</span></div>`).join("")}</div>
      ${r.alerts_raised.length ? `<div class="mv" style="color:#9a4b00"><b>⚠ This order triggered an alert:</b> ${r.alerts_raised.map(a => esc(a.ingredient)).join(", ")} — check the manager dashboard.</div>` : ""}
      ${o.remote && o.remote.status !== "local_only" ? `<div class="mv muted">${o.remote.status === "sent" ? `Recorded in the team's BarMade backend as ${esc(o.remote.id)}.` : `Kept locally — BarMade didn't accept it (${esc(o.remote.error)}).`}</div>` : ""}</div>`;
    cart = {}; menu = await api("/api/menu"); renderMenu(); update();
  } catch (e) {
    const short = (e.details && e.details.shortages || []).map(s => `${esc(s.ingredient)} (needs ${s.needed} ${s.unit}, est. ${s.estimated_on_hand})`).join("; ");
    $("#out").innerHTML = `<div class="err"><b>Couldn't place that order.</b><div>${esc(e.message || "Unknown error")}</div>${short ? `<div class="muted" style="margin-top:4px">${short}</div>` : ""}</div>`;
    update();
  }
  $("#out").scrollIntoView({behavior:"smooth", block:"nearest"});
};
init();
</script>
</body>
</html>
